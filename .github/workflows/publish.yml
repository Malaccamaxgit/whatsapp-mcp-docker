name: Publish to Docker Hub

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version and short SHA
        id: meta
        run: |
          version=$(jq -r .version package.json)
          short_sha=${GITHUB_SHA::7}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Publishing version=$version sha=$short_sha"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          # latest moves on every push. The version tag is rewritten until the
          # version in package.json changes. The sha tag is immutable and is the
          # handle to use for a rollback.
          tags: |
            malaccamax/whatsapp-mcp-docker:latest
            malaccamax/whatsapp-mcp-docker:${{ steps.meta.outputs.version }}
            malaccamax/whatsapp-mcp-docker:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
